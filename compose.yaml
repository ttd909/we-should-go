services:
  extraction-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: we-should-go-worker
    env_file:
      - ./worker/.env
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

